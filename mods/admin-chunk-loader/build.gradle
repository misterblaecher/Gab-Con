plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

base { archivesName = 'gabcon-admin-chunk-loader' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.architectury.dev' }
    mavenCentral()
}

dependencies {
    // FTB versions correspondant exactement aux JARs du serveur GabCon
    implementation 'dev.ftb.mods:ftb-chunks-neoforge:2101.1.22'
    implementation 'dev.ftb.mods:ftb-library-neoforge:2101.1.36'
    implementation 'dev.ftb.mods:ftb-teams-neoforge:2101.1.11'
}

neoForge {
    version = project.neo_version
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    inputs.property 'mod_version', project.mod_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'mod_version': project.mod_version
    }
}
