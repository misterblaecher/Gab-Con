name: Apply Gab Con visuals

on:
  workflow_dispatch:
  push:
    paths:
      - "Loading-screen-panorama-1.png"
      - "Loading-screen.png"
      - "tools/apply_gabcon_visuals.py"
      - ".github/workflows/apply-gabcon-visuals.yml"

permissions:
  contents: write

jobs:
  visuals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Generate panorama, join screen and transparent GUI
        run: python tools/apply_gabcon_visuals.py

      - name: Build resource pack and datapack ZIPs
        shell: bash
        run: |
          set -euo pipefail

          rm -f "1.21.1-Gab Con.zip"
          (
            cd resource-pack
            zip -qr "../1.21.1-Gab Con.zip" .
          )

          rm -f "GabCon-Datapack-1.21.1.zip"
          (
            cd datapack
            zip -qr "../GabCon-Datapack-1.21.1.zip" .
          )

      - name: Commit generated visuals and ZIPs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resource-pack datapack sources "1.21.1-Gab Con.zip" "GabCon-Datapack-1.21.1.zip"
          if git diff --cached --quiet; then
            echo "Visual assets and ZIPs already up to date."
            exit 0
          fi
          git commit -m "Apply Gab Con loading screens and transparent GUI"
          git pull --rebase origin main
          git push origin HEAD:main
