name: Unpack Gab Con resource pack

on:
  workflow_dispatch:
  push:
    paths:
      - "1.21.1-Gab Con.zip"
      - ".github/unpack-trigger"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack resource pack
        shell: bash
        run: |
          set -euo pipefail
          rm -rf resource-pack
          mkdir -p resource-pack
          unzip -q "1.21.1-Gab Con.zip" -d resource-pack

      - name: Commit unpacked files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resource-pack
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Unpack Gab Con resource pack"
          git pull --rebase origin main
          git push origin HEAD:main
