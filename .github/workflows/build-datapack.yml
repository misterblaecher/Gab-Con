name: Build Gab Con datapack

on:
  workflow_dispatch:
  push:
    paths:
      - "datapack/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build datapack ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f "GabCon-Datapack-1.21.1.zip"
          cd datapack
          zip -qr "../GabCon-Datapack-1.21.1.zip" .
          cd ..

      - name: Commit ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "GabCon-Datapack-1.21.1.zip"
          if git diff --cached --quiet; then
            echo "Datapack ZIP already up to date."
            exit 0
          fi
          git commit -m "Build Gab Con datapack ZIP"
          git pull --rebase origin main
          git push origin HEAD:main
