name: Build GabCon GET
on:
  push:
    paths:
      - 'mods/gabcon-get/**'
      - '.github/workflows/build-gabcon-get.yml'
  pull_request:
    paths:
      - 'mods/gabcon-get/**'
      - '.github/workflows/build-gabcon-get.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile and package mod
        working-directory: mods/gabcon-get
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: gabcon-get-neoforge-1.21.1
          path: mods/gabcon-get/build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: gabcon-get-source
          path: |
            mods/gabcon-get/build.gradle
            mods/gabcon-get/gradle.properties
            mods/gabcon-get/settings.gradle
            mods/gabcon-get/README.md
            mods/gabcon-get/src/**
          if-no-files-found: error
