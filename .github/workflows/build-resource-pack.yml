name: Build Gab Con resource pack

on:
  workflow_dispatch:
  push:
    paths:
      - "resource-pack/**"
      - "*.mp3"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build NPC sounds
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          out="resource-pack/assets/minecraft/sounds/gabcon"
          mkdir -p "$out"

          convert_sound() {
            local src="$1"
            local dst="$2"
            ffmpeg -hide_banner -loglevel error -y \
              -i "$src" -vn -ac 1 -ar 44100 \
              -c:a libvorbis -q:a 5 "$out/$dst"
          }

          convert_sound "tes_malade_toi-villager.mp3" "villager_tes_malade_toi.ogg"
          convert_sound "1kg-de-carotte-villager.mp3" "villager_1kg_de_carotte.ogg"
          convert_sound "et-quest-ce-voulez-vous-que-ca-mfoute-villager.mp3" "villager_et_quest_ce_voulez_vous_que_ca_mfoute.ogg"
          convert_sound "pas_faisable-villager.mp3" "villager_pas_faisable.ogg"

          convert_sound "nathalie-present-horses.mp3" "horse_nathalie_present.ogg"
          convert_sound "francois-damiens-ou-tu-sors-ou-je-te-sors-zombies.mp3" "zombie_ou_tu_sors.ogg"
          convert_sound "termine-bonsoir-francois-damiens-ender.dragron.mp3" "ender_dragon_termine_bonsoir.ogg"
          convert_sound "francois-damiens-rire-real-pigs.mp3" "pig_francois_damiens_rire.ogg"
          convert_sound "du-bist-gut-genug-loud-enderman.mp3" "enderman_du_bist_gut_genug_loud.ogg"

      - name: Build ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f "1.21.1-Gab Con.zip"
          cd resource-pack
          zip -qr "../1.21.1-Gab Con.zip" .
          cd ..

      - name: Commit generated pack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             "resource-pack/assets/minecraft/sounds"             "resource-pack/assets/minecraft/sounds.json"             "1.21.1-Gab Con.zip"

          if git diff --cached --quiet; then
            echo "Resource pack already up to date."
            exit 0
          fi

          git commit -m "Build NPC sounds and resource pack ZIP"
          branch="${GITHUB_REF_NAME}"
          git pull --rebase origin "$branch"
          git push origin "HEAD:$branch"
